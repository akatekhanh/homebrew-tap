name: Update cask

# Bumps Casks/cruft.rb to the latest GitHub release of akatekhanh/cruft.
# Runs when the cruft release workflow dispatches here, on a schedule as a
# fallback, and by hand.
on:
  repository_dispatch:
    types: [cruft-release]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve latest release
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo akatekhanh/cruft --json tagName -q .tagName)
          version=${tag#v}
          url="https://github.com/akatekhanh/cruft/releases/download/${tag}/Cruft-macOS.zip"
          curl -sSL -o Cruft-macOS.zip "$url"
          sha=$(sha256sum Cruft-macOS.zip | cut -d' ' -f1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "latest: $version $sha"

      - name: Rewrite cask
        run: |
          sed -i -E "s/^  version \".*\"$/  version \"${{ steps.rel.outputs.version }}\"/" Casks/cruft.rb
          sed -i -E "s/^  sha256 \".*\"$/  sha256 \"${{ steps.rel.outputs.sha }}\"/" Casks/cruft.rb
          git diff --stat

      - name: Commit and push
        run: |
          if git diff --quiet; then echo "cask already current"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "cruft ${{ steps.rel.outputs.version }}"
          git push
